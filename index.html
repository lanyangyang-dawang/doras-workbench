<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F5F3EF">
  <link rel="manifest" href="manifest.json">
  <title>Dora's 工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans SC', sans-serif; background: #F5F3EF; }
    .app-shell { min-height: 100vh; position: relative; background: #F5F3EF; overflow: hidden; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .sidebar { width: 90px; background: #FFFFFF; border-right: 1px solid #EBE8E3; flex-shrink: 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-radius: 14px; margin: 6px 8px; cursor: pointer; transition: all .2s; }
    .nav-item.active { background: #FFF8EC; }
    .nav-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; }
    .nav-label { display: block; }
    .card { background: #FFFFFF; border-radius: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .btn-primary { background: #2D2D2D; color: #fff; border-radius: 14px; }
    .checkbox { width: 22px; height: 22px; border: 2px solid #C8C4BC; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
    .checkbox.done { background: #34C759; border-color: #34C759; }
    .checkbox svg { width: 13px; height: 13px; color: white; opacity: 0; }
    .checkbox.done svg { opacity: 1; }
    .status-pending { background: #FFF8EC; color: #E6A23C; }
    .status-done { background: #E8F5E9; color: #34C759; }
    input, textarea { outline: none; }
    .modal-overlay { background: rgba(0,0,0,0.45); }
    .week-summary { background: linear-gradient(135deg, #FFF8EC 0%, #FFFFFF 100%); }
    .pnl-positive { color: #34C759; }
    .pnl-negative { color: #E53935; }
    @keyframes bell-ring { 0%,100% { transform: rotate(0); } 10% { transform: rotate(8deg); } 20% { transform: rotate(-8deg); } 30% { transform: rotate(4deg); } 40% { transform: rotate(-4deg); } 50% { transform: rotate(0); } }
    .bell-ring { animation: bell-ring 1.2s ease-in-out infinite; }
    /* Lock screen */
    .lock-screen { background: linear-gradient(180deg, #FFF8EC 0%, #F5F3EF 100%); }
    .lock-input { background: rgba(255,255,255,0.85); border: 1px solid #EBE8E3; border-radius: 16px; color: #333; }
    .lock-input::placeholder { color: #B0ABA3; }
  </style>
</head>
<body class="text-gray-800">

<!-- Lock Screen -->
<div id="lock-screen" class="lock-screen fixed inset-0 z-[100] flex items-center justify-center">
  <div class="w-full max-w-[400px] px-6">
    <div class="text-center mb-6">
      <img src="icon.jpg" class="lock-avatar w-20 h-20 rounded-full object-cover border-4 border-amber-100 shadow-md mx-auto mb-4" alt="Dora">
      <h1 class="lock-title text-2xl font-bold text-gray-800">Dora's 工作台</h1>
      <p id="lock-hint" class="text-sm text-gray-500 mt-2">请输入密码解锁</p>
    </div>

    <!-- Tab 切换 -->
    <div class="bg-white/70 rounded-2xl p-1 flex gap-1 mb-5 border border-amber-100/60">
      <button id="lock-tab-unlock" type="button" onclick="switchLockTab('unlock')" class="flex-1 py-2 text-xs font-medium rounded-xl bg-white shadow-sm text-gray-800 transition">密码解锁</button>
      <button id="lock-tab-sync" type="button" onclick="switchLockTab('sync')" class="flex-1 py-2 text-xs font-medium rounded-xl text-gray-500 transition">同步导入</button>
    </div>

    <!-- 密码模式 -->
    <div id="lock-pwd-form">
      <div id="lock-set" class="hidden space-y-3 mb-4">
        <input id="lock-new-pwd" type="password" placeholder="设置密码（至少4位）" class="lock-input w-full px-4 py-3 text-sm">
        <input id="lock-confirm-pwd" type="password" placeholder="确认密码" class="lock-input w-full px-4 py-3 text-sm">
      </div>
      <div id="lock-enter" class="hidden mb-4">
        <input id="lock-pwd" type="password" placeholder="输入密码" class="lock-input w-full px-4 py-3 text-sm" autocomplete="off">
      </div>
      <p id="lock-error" class="text-red-500 text-xs text-center mb-3 hidden"></p>
      <button id="lock-btn" onclick="handleLock()" class="btn-primary w-full py-3 text-sm font-medium">解锁</button>
      <p id="lock-help" class="text-xs text-gray-400 text-center mt-4 leading-relaxed">
        💡 在两台设备上设置相同的密码即可通用
      </p>
    </div>

    <!-- 同步码导入模式 -->
    <div id="lock-sync-form" class="hidden">
      <p class="text-xs text-gray-500 mb-3 leading-relaxed">
        如果你的另一台设备已经设置过密码，可以把那里的「同步码」粘贴到下方，本设备会解锁同样的内容：
      </p>
      <textarea id="lock-sync-input" rows="4" placeholder="把同步码粘贴到这里..." class="lock-input w-full px-4 py-3 text-xs font-mono break-all resize-none" style="white-space: pre-wrap; word-break: break-all;"></textarea>
      <p id="lock-sync-error" class="text-red-500 text-xs text-center mt-2 hidden"></p>
      <button onclick="handleImportSync()" class="btn-primary w-full py-3 text-sm font-medium mt-3">导入并解锁</button>
      <p class="text-xs text-gray-400 text-center mt-4 leading-relaxed">
        💡 先在已设密码的设备上点底部「修改密码」→「同步到其他设备」
      </p>
    </div>
  </div>
</div>

<div id="app" class="app-shell hidden flex">
  <!-- Sidebar -->
  <aside class="sidebar h-screen flex flex-col justify-between py-4">
    <div>
      <div class="text-center mb-6 px-2">
        <img src="icon.jpg" class="w-12 h-12 rounded-full object-cover border-2 border-amber-100 shadow-sm mx-auto" alt="Dora">
        <div class="text-xs font-bold text-gray-800 mt-2">Dora's</div>
        <div class="text-[10px] text-gray-400">工作台</div>
      </div>
      <div class="nav-item active" data-page="tasks" onclick="switchPage('tasks')">
        <div class="nav-icon bg-amber-50">📋</div>
        <span class="nav-label text-[11px] sm:text-sm text-gray-700 font-medium">每日任务</span>
      </div>
      <div class="nav-item" data-page="notes" onclick="switchPage('notes')">
        <div class="nav-icon bg-blue-50">📝</div>
        <span class="nav-label text-[11px] sm:text-sm text-gray-700 font-medium">学习笔记</span>
      </div>
      <div class="nav-item" data-page="finance" onclick="switchPage('finance')">
        <div class="nav-icon bg-green-50">💰</div>
        <span class="nav-label text-[11px] sm:text-sm text-gray-700 font-medium">理财记录</span>
      </div>
    </div>
    <div class="px-3 pb-2 flex flex-col gap-2">
      <button onclick="openDataSyncModal()" class="w-full py-2 rounded-xl bg-blue-50 text-blue-700 text-[11px] font-medium flex items-center justify-center gap-1">
        <span>🔄</span><span>数据同步</span>
      </button>
      <button id="restore-backup-btn" onclick="restoreImportBackupFromSidebar()" class="w-full py-2 rounded-xl bg-amber-50 text-amber-700 text-[11px] font-medium flex items-center justify-center gap-1 hidden">
        <span>🩹</span><span>恢复最近备份</span>
      </button>
      <button onclick="openPushSettingsModal()" class="w-full py-2 rounded-xl bg-gray-100 text-gray-600 text-[11px] font-medium flex items-center justify-center gap-1">
        <span>🔔</span><span>微信推送</span>
      </button>
      <button onclick="openChangePwdModal()" class="w-full py-2 rounded-xl bg-gray-100 text-gray-600 text-[11px] font-medium flex items-center justify-center gap-1">
        <span>🔒</span><span>修改密码</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 h-screen overflow-y-auto hide-scrollbar">
    <div id="content" class="content-wrap p-4 pb-24">
      <!-- Dynamic content -->
    </div>
  </main>
</div>

<!-- Modal -->
<div id="modal" class="modal-overlay fixed inset-0 z-[90] hidden flex items-end sm:items-center justify-center"></div>

<script>
/* =============== State =============== */
const storeKey = 'dora_workbench_state';
let state = loadState();
let currentPage = 'tasks';
let editingNoteId = null;
let editingTaskId = null;

/* =============== Safe Storage (兼容沙箱/隐私模式) =============== */
let memoryStore = {};
function safeGetItem(key) {
  try { if (window.localStorage) return localStorage.getItem(key); } catch (e) {}
  return memoryStore[key] || null;
}
function safeSetItem(key, value) {
  try { if (window.localStorage) { localStorage.setItem(key, value); return; } } catch (e) {}
  memoryStore[key] = value;
}
function safeRemoveItem(key) {
  try { if (window.localStorage) { localStorage.removeItem(key); return; } } catch (e) {}
  delete memoryStore[key];
}

function loadState() {
  const raw = safeGetItem(storeKey);
  const defaults = {
    tasks: [
      { id: 1, title: '作息', desc: '21:40入睡 → 6:40起床', reminder: '06:40', done: false },
      { id: 2, title: '英语单词', desc: '每日词汇积累', reminder: '21:00', done: false },
      { id: 3, title: '英语听力', desc: '每日听力训练', reminder: '21:01', done: false },
      { id: 4, title: '英语口语', desc: '每日口语练习', reminder: '21:02', done: false }
    ],
    notes: [],
    finance: [],
    taskHistory: {},
    lastVisitDate: ''
  };
  if (!raw) return defaults;
  try {
    const parsed = { ...defaults, ...JSON.parse(raw) };
    parsed.taskHistory = parsed.taskHistory || {};
    parsed.lastVisitDate = parsed.lastVisitDate || '';
    // 兼容旧理财记录：没有 sector 字段的用 name 作为板块
    if (Array.isArray(parsed.finance)) {
      parsed.finance.forEach(item => {
        if (!item.sector && item.name) item.sector = item.name;
      });
    }
    return parsed;
  } catch { return defaults; }
}
function saveState() { safeSetItem(storeKey, JSON.stringify(state)); }

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function weekDateKeys() {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now);
  mon.setDate(now.getDate() - day + 1);
  const keys = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  }
  return keys;
}

function initApp() {
  checkDailyReset();
  switchPage('tasks');
  refreshRestoreBtn();
  setInterval(checkPushReminders, 30000);
  checkPushReminders();
}

function checkDailyReset() {
  const today = todayKey();
  if (state.lastVisitDate !== today) {
    state.tasks.forEach(t => {
      if (t.done) {
        if (!state.taskHistory[t.id]) state.taskHistory[t.id] = [];
        state.taskHistory[t.id].push(state.lastVisitDate || today);
        if (state.taskHistory[t.id].length > 7) state.taskHistory[t.id].shift();
      }
      t.done = false;
    });
    state.lastVisitDate = today;
    saveState();
  }
}

function switchPage(page) {
  currentPage = page;
  currentSector = null;
  viewingSectorDetail = false;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  render();
}

/* =============== Helpers =============== */
const todayStr = () => new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' });
const weekRange = () => {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now); mon.setDate(now.getDate() - day + 1);
  const sun = new Date(now); sun.setDate(now.getDate() + (7 - day));
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${fmt(mon)} - ${fmt(sun)}`;
};
const isSunday = () => new Date().getDay() === 0;

/* =============== Daily Tasks =============== */
function renderTasks() {
  const pending = state.tasks.filter(t => !t.done).length;
  const total = state.tasks.length;
  const today = new Date();
  const dateLabel = `${today.getMonth()+1}/${today.getDate()} 周${'日一二三四五六'[today.getDay()]}`;

  let html = `
    <div class="mb-4 flex items-start justify-between">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">每日任务</h2>
        <p class="text-sm text-gray-500 mt-1">今日待办 · ${dateLabel}</p>
      </div>
      <div class="text-right">
        <div class="text-2xl font-bold text-gray-800">${pending}</div>
        <div class="text-xs text-gray-400">剩余 ${total}</div>
      </div>
    </div>

    <div class="card p-4 mb-4">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-xl">✅</span>
        <span class="font-bold text-gray-800">今日待办清单</span>
      </div>
      <div class="space-y-3">
        ${state.tasks.map(t => taskCard(t)).join('')}
      </div>

      <!-- 添加任务 -->
      <div class="mt-4 pt-4 border-t border-gray-100">
        <div class="space-y-3">
          <input id="new-task-title" type="text" placeholder="任务名称..." class="w-full bg-gray-100 rounded-xl px-3 py-2.5 text-sm">
          <input id="new-task-desc" type="text" placeholder="任务内容（可选）" class="w-full bg-gray-100 rounded-xl px-3 py-2.5 text-sm">
          <div class="flex gap-3">
            <input id="new-task-reminder" type="time" class="flex-1 bg-gray-100 rounded-xl px-3 py-2.5 text-sm">
            <button onclick="addTask()" class="px-5 rounded-xl btn-primary text-sm font-medium">添加</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card p-4 mb-4 week-summary">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <span class="text-xl">🏆</span>
          <span class="font-bold text-gray-800">本周完成情况</span>
        </div>
        <span class="text-sm text-gray-500">${weekRange()}</span>
      </div>
      <div class="space-y-2">
        ${ state.tasks.map(t => {
          const weekKeys = weekDateKeys();
          const history = (state.taskHistory[t.id] || []).filter(d => weekKeys.includes(d));
          return `
              <div class="flex items-center justify-between text-sm">
                <span class="text-gray-700 ${t.done ? 'line-through text-gray-400' : ''}">${escapeHtml(t.title)}</span>
                <span class="text-gray-500">${history.length}/7</span>
              </div>
            `;
          }).join('')
        }
      </div>
    </div>
  `;
  return html;
}

function taskCard(t) {
  return `
    <div class="card p-3 flex items-center gap-3">
      <div class="checkbox ${t.done ? 'done' : ''}" onclick="toggleTask(${t.id})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-bold text-gray-800 ${t.done ? 'line-through text-gray-400' : ''}">${escapeHtml(t.title)}</div>
        <div class="text-xs text-gray-500 mt-0.5 ${t.done ? 'line-through text-gray-400' : ''}">${escapeHtml(t.desc)}</div>
        ${t.reminder ? `<div class="flex items-center gap-1 text-[11px] text-gray-400 mt-1"><span>⏰</span><span>${t.reminder}</span></div>` : ''}
      </div>
      <div class="flex flex-col items-end gap-2">
        <div class="text-[11px] px-2 py-1 rounded-lg ${t.done ? 'status-done' : 'status-pending'}">${t.done ? '已完成' : '待完成'}</div>
        <div class="flex gap-2">
          <button onclick="openTaskModal(${t.id})" class="text-[11px] text-gray-500">编辑</button>
          <button onclick="deleteTask(${t.id})" class="text-[11px] text-red-500">删除</button>
        </div>
      </div>
    </div>
  `;
}

function addTask() {
  const title = document.getElementById('new-task-title').value.trim();
  const desc = document.getElementById('new-task-desc').value.trim();
  const reminder = document.getElementById('new-task-reminder').value;
  if (!title) { alert('请填写任务名称'); return; }
  const id = state.tasks.length ? Math.max(...state.tasks.map(x => x.id)) + 1 : 1;
  state.tasks.push({ id, title, desc, reminder, done: false });
  saveState();
  render();
}

function toggleTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const today = todayKey();
  t.done = !t.done;
  if (t.done) {
    if (!state.taskHistory[t.id]) state.taskHistory[t.id] = [];
    if (!state.taskHistory[t.id].includes(today)) {
      state.taskHistory[t.id].push(today);
      if (state.taskHistory[t.id].length > 7) state.taskHistory[t.id].shift();
    }
  } else {
    if (state.taskHistory[t.id]) {
      state.taskHistory[t.id] = state.taskHistory[t.id].filter(d => d !== today);
    }
  }
  saveState();
  render();
}

function openTaskModal(id = null) {
  editingTaskId = id;
  const t = id ? state.tasks.find(x => x.id === id) : null;
  showModal(`
    <div class="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-[430px] p-5">
      <h3 class="text-lg font-bold text-gray-800 mb-4 text-center">${id ? '编辑任务' : '新建任务'}</h3>
      <div class="space-y-3">
        <input id="task-title" type="text" placeholder="任务名称" value="${escapeHtml(t ? t.title : '')}" class="w-full bg-gray-100 rounded-xl px-3 py-2.5 text-sm">
        <input id="task-desc" type="text" placeholder="任务内容" value="${escapeHtml(t ? t.desc : '')}" class="w-full bg-gray-100 rounded-xl px-3 py-2.5 text-sm">
        <div>
          <label class="text-xs text-gray-500 mb-1 block">提醒时间</label>
          <input id="task-reminder" type="time" value="${escapeHtml(t ? t.reminder : '')}" class="w-full bg-gray-100 rounded-xl px-3 py-2.5 text-sm">
        </div>
      </div>
      <p id="task-error" class="text-red-500 text-xs text-center mt-2 hidden"></p>
      <div class="flex gap-3 mt-5">
        <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-700 text-sm font-medium">取消</button>
        <button onclick="saveTask()" class="flex-1 py-3 rounded-xl btn-primary text-sm font-medium">保存</button>
      </div>
    </div>
  `);
}

function saveTask() {
  const title = document.getElementById('task-title').value.trim();
  const desc = document.getElementById('task-desc').value.trim();
  const reminder = document.getElementById('task-reminder').value;
  const err = document.getElementById('task-error');
  err.classList.add('hidden');
  if (!title) { err.textContent = '请填写任务名称'; err.classList.remove('hidden'); return; }
  if (editingTaskId) {
    const t = state.tasks.find(x => x.id === editingTaskId);
    Object.assign(t, { title, desc, reminder });
  } else {
    const id = state.tasks.length ? Math.max(...state.tasks.map(x => x.id)) + 1 : 1;
    state.tasks.push({ id, title, desc, reminder, done: false });
  }
  saveState(); closeModal(); render();
}

function deleteTask(id) {
  if (confirm('确定删除这条任务吗？')) {
    state.tasks = state.tasks.filter(x => x.id !== id);
    delete state.taskHistory[id];
    saveState(); render();
  }
}

let noteSearchKeyword = '';

/* =============== Study Notes =============== */
function renderNotes() {
  const pending = state.notes.filter(n => !n.done).length;
  const kw = noteSearchKeyword.trim().toLowerCase();
  const filteredNotes = kw
    ? state.notes.filter(n =>
        (n.title || '').toLowerCase().includes(kw) ||
        (n.content || '').toLowerCase().includes(kw) ||
        (n.date || '').includes(kw))
    : state.notes;
  return `
    <div class="mb-4 flex items-start justify-between">
      <div>
        <h2 class="text-2xl font-bold text-gray-800">学习笔记</h2>
        <p class="text-sm text-gray-500 mt-1">记录每天学到的知识点</p>
      </div>
      <div class="text-right">
        <div class="text-2xl font-bold text-gray-800">${pending}</div>
        <div class="text-xs text-gray-400">待复习</div>
      </div>
    </div>
    <div class="flex gap-2 mb-4">
      <input id="note-search" type="text" placeholder="搜索笔记..." value="${escapeHtml(noteSearchKeyword)}" oninput="onNoteSearch(this.value)" class="flex-1 bg-gray-100 rounded-xl px-3 py-2.5 text-sm">
      ${kw ? `<button onclick="clearNoteSearch()" class="px-3 rounded-xl bg-gray-200 text-gray-600 text-sm">清除</button>` : ''}
    </div>
    <button onclick="openNoteModal()" class="btn-primary w-full py-3 text-sm font-medium mb-4 shadow-sm">+ 新建笔记</button>
    <div class="space-y-3">
      ${filteredNotes.length
        ? filteredNotes.map(n => `
          <div class="card p-4">
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1">
                <div class="font-bold text-gray-800 ${n.done ? 'line-through text-gray-400' : ''}">${n.title}</div>
                <div class="text-xs text-gray-500 mt-1">${n.date}</div>
                <div class="text-sm text-gray-600 mt-2 leading-relaxed whitespace-pre-wrap">${n.content}</div>
                ${n.image ? `<img src="${n.image}" class="mt-3 rounded-xl max-h-56 object-cover w-full cursor-pointer" onclick="window.open('${n.image}')" alt="笔记图片">` : ''}
              </div>
              <div class="flex flex-col items-end gap-2">

function onNoteImageSelected(input) {

function saveNote() {

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy') ? resolve() : reject(new Error('copy failed')); }
    catch (e) { reject(e); }
    document.body.removeChild(ta);
  });
}

async function shareNote(id) {
  const n = state.notes.find(x => x.id === id);
  if (!n) return;
  const text = `${n.title}
${n.date}

${n.content}`;
  if (navigator.share) {
    try {
      await navigator.share({ title: n.title, text: text });
      return;
    } catch (e) {
      if (e.name !== 'AbortError') console.error(e);
    }
  }
  try {
    await copyText(text);
    alert('笔记内容已复制到剪贴板，可以粘贴分享了');
  } catch (e) {
    alert('分享失败，请手动复制');
  }
}

/* =============== Finance =============== */
function calcPnL(item) {
  const buy = parseFloat(item.buy) || 0;
  const sell = parseFloat(item.sell) || 0;
  const qty = parseInt(item.qty) || 0;
  const fee = parseFloat(item.fee) || 0;
  if (!sell) return 0;
  return (sell - buy) * qty - fee;
}

/* =============== Finance Helpers =============== */
// 旧数据没有 sector 字段时，用 name 作为板块名做兼容
function getSectorName(item) {
  return (item.sector || item.name || '未分类').trim();
}

// 按日期倒序排（最新日期在最前）
function sortByDateDesc(a, b) {
  return new Date(b.date) - new Date(a.date);
}

function getSortedFinance() {
  return [...state.finance].sort(sortByDateDesc);
}

// 按板块分组并计算总盈亏
function groupBySector() {
  const groups = {};
  getSortedFinance().forEach(item => {
    const sector = getSectorName(item);
    if (!groups[sector]) {
      groups[sector] = { sector, records: [], total: 0, latestDate: '' };
    }
    groups[sector].records.push(item);
    groups[sector].total += calcPnL(item);
    if (item.date && item.date > groups[sector].latestDate) {
      groups[sector].latestDate = item.date;
    }
  });
  // 板块按最新交易日期倒序排
  return Object.values(groups).sort((a, b) => new Date(b.latestDate) - new Date(a.latestDate));
}

function getUniqueSectors() {
  return [...new Set(state.finance.map(getSectorName).filter(Boolean))];
}

let viewingSectorDetail = false;

function renderFinance() {

/* =============== Lock Screen =============== */
const pwdKey = 'dora_password_hash';
function simpleHash(pwd) {
  // 降级方案：当 crypto.subtle 不可用时使用（如部分预览沙箱）
  let h = 5381;
  for (let i = 0; i < pwd.length; i++) h = ((h << 5) + h) + pwd.charCodeAt(i);
  return Math.abs(h).toString(16).padStart(64, '0');
}
function hashPwd(pwd) {
  const enc = new TextEncoder();
  if (typeof crypto !== 'undefined' && crypto.subtle && crypto.subtle.digest) {
    return crypto.subtle.digest('SHA-256', enc.encode(pwd)).then(buf => {
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    });
  }
  return Promise.resolve(simpleHash(pwd));
}

function unlockApp() {
  document.getElementById('lock-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  initApp();
}

function initLockScreen() {
  const hasPwd = safeGetItem(pwdKey);
  const lockSet = document.getElementById('lock-set');
  const lockEnter = document.getElementById('lock-enter');
  const lockHint = document.getElementById('lock-hint');
  const lockBtn = document.getElementById('lock-btn');
  if (hasPwd) {
    lockSet.classList.add('hidden');
    lockEnter.classList.remove('hidden');
    lockHint.textContent = '请输入密码解锁';
    lockBtn.textContent = '解锁';
  } else {
    lockSet.classList.remove('hidden');
    lockEnter.classList.add('hidden');
    lockHint.textContent = '首次使用，请设置密码';
    lockBtn.textContent = '设置密码';
  }
  // 强制切回密码解锁 Tab，避免错误状态
  if (typeof switchLockTab === 'function') switchLockTab('unlock');
}

function switchLockTab(tab) {
  const tabUnlock = document.getElementById('lock-tab-unlock');
  const tabSync = document.getElementById('lock-tab-sync');
  const pwdForm = document.getElementById('lock-pwd-form');
  const syncForm = document.getElementById('lock-sync-form');
  const activeCls = 'flex-1 py-2 text-xs font-medium rounded-xl bg-white shadow-sm text-gray-800 transition';
  const inactiveCls = 'flex-1 py-2 text-xs font-medium rounded-xl text-gray-500 transition';
  const errorEl = document.getElementById('lock-error');
  if (errorEl) errorEl.classList.add('hidden');
  const syncErr = document.getElementById('lock-sync-error');
  if (syncErr) syncErr.classList.add('hidden');
  if (!tabUnlock || !tabSync || !pwdForm || !syncForm) return;
  if (tab === 'sync') {
    tabUnlock.className = inactiveCls;
    tabSync.className = activeCls;
    pwdForm.classList.add('hidden');
    syncForm.classList.remove('hidden');
  } else {
    tabUnlock.className = activeCls;
    tabSync.className = inactiveCls;
    pwdForm.classList.remove('hidden');
    syncForm.classList.add('hidden');
  }
}

function handleImportSync() {
  const errorEl = document.getElementById('lock-sync-error');
  errorEl.classList.add('hidden');
  const raw = (document.getElementById('lock-sync-input').value || '').trim();
  if (!raw) {
    errorEl.textContent = '请粘贴同步码';
    errorEl.classList.remove('hidden');
    return;
  }
  // 规整：去掉空白、破折号、转小写
  const normalized = raw.replace(/[\s\-]/g, '').toLowerCase();
  // 校验：64 位 SHA-256 十六进制
  if (!/^[0-9a-f]{64}$/.test(normalized)) {
    errorEl.textContent = '同步码格式不正确，请检查后重试';
    errorEl.classList.remove('hidden');
    return;
  }
  safeSetItem(pwdKey, normalized);
  document.getElementById('lock-sync-input').value = '';
  switchLockTab('unlock');
  initLockScreen();
  unlockApp();
}

function setLockLoading(loading) {
  const btn = document.getElementById('lock-btn');
  if (!btn) return;
  btn.disabled = loading;
  btn.dataset.origText = btn.dataset.origText || btn.textContent;
  btn.textContent = loading ? '请稍候...' : btn.dataset.origText;
}

function handleLock() {
  const hasPwd = safeGetItem(pwdKey);
  const errorEl = document.getElementById('lock-error');
  errorEl.classList.add('hidden');
  setLockLoading(true);
  if (hasPwd) {
    const input = document.getElementById('lock-pwd').value;
    if (!input) { errorEl.textContent = '请输入密码'; errorEl.classList.remove('hidden'); setLockLoading(false); return; }
    hashPwd(input).then(hash => {
      if (hash === hasPwd) { unlockApp(); }
      else { errorEl.textContent = '密码错误'; errorEl.classList.remove('hidden'); setLockLoading(false); }
    }).catch(e => {
      errorEl.textContent = '解锁出错，请重试'; errorEl.classList.remove('hidden');
      console.error(e); setLockLoading(false);
    });
  } else {
    const newPwd = document.getElementById('lock-new-pwd').value;
    const confirmPwd = document.getElementById('lock-confirm-pwd').value;

async function copySyncCode() {

  const btn = document.getElementById('sync-code-copy-btn');
  const setFeedback = (msg) => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = msg;
    setTimeout(() => { btn.textContent = orig; }, 1500);
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      // 老浏览器 fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
    }
    setFeedback('已复制 ✓');
  } catch (e) {
    setFeedback('复制失败，请手动选择');
  }
}

const pushKey = 'dora_pushplus_config';
function getPushConfig() {
  try {
    const raw = safeGetItem(pushKey);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { token: '', enabled: false };
}
function savePushConfig(cfg) {

}
async function pushPlusSend(token, title, content) {
  if (!token) throw new Error('token 为空');
  const body = JSON.stringify({ token, title, content, template: 'txt' });
  let lastErr = null;
  // 主路径：POST（带超时 + CORS 预检，pushplus 官方支持）
  try {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 10000);
    const resp = await fetch('https://www.pushplus.plus/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
      signal: ctrl.signal
    });
    clearTimeout(tid);
    const json = await resp.json().catch(() => null);
    if (json && json.code === 200) return json;
    lastErr = new Error((json && json.msg) || ('HTTP ' + resp.status));
  } catch (e) {
    lastErr = e;
  }
  // 回退：GET 简单请求（不触发 CORS 预检）
  try {
    const params = new URLSearchParams({ token, title, content, template: 'txt' });
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), 10000);
    const resp = await fetch('https://www.pushplus.plus/send?' + params.toString(), {
      method: 'GET',
      signal: ctrl.signal
    });
    clearTimeout(tid);
    const json = await resp.json().catch(() => null);
    if (json && json.code === 200) return json;
    lastErr = new Error((json && json.msg) || ('HTTP ' + resp.status));
  } catch (e) {
    lastErr = e;
  }
  // 两条路都失败
  const msg = (lastErr && lastErr.message) || '未知错误';
  throw new Error(msg + ' · 请检查网络或 pushplus 服务状态');
}

function compressState(data, includeImages = true) {
  const payload = includeImages ? data : JSON.parse(data);
  if (!includeImages && Array.isArray(payload.notes)) {
    payload.notes = payload.notes.map(n => ({ ...n, image: undefined }));
  }
  const json = JSON.stringify(payload);
  if (typeof pako !== 'undefined') {
    const compressed = pako.deflate(json, { level: 9 });
    return btoa(String.fromCharCode(...compressed));
  }
  if (typeof LZString !== 'undefined') {
    return LZString.compressToBase64(json);
  }
  return btoa(unescape(encodeURIComponent(json)));
}

function importData() {
  const err = document.getElementById('import-error');
  err.classList.add('hidden');
  let raw = document.getElementById('import-text').value.trim();
  if (!raw) {
    err.textContent = '请粘贴数据码';
    err.classList.remove('hidden');
    return;
  }
  // ====== 自动清理数据码 ======
  // 1. 移除所有空白和反斜杠（跨设备复制时偶尔会引入）
  const before = raw;
  raw = raw.replace(/[\s\\]+/g, '');
  // 2. 兼容 URL-safe Base64（将 - / _ 还原成 + 和 /）
  raw = raw.replace(/-/g, '+').replace(/_/g, '/');
  const cleanedCount = before.length - raw.length;
  // 3. 去除等号填充（pako 输出的 btoa 可能因为尾部 padding 出现 =，但放在末尾是合法的；这里只移除中间可能误加的字符）
  // ====== 字符集校验 ======
  // 标准 Base64 字符集：A-Z a-z 0-9 + / =
  const invalidChars = raw.match(/[^A-Za-z0-9+\/=]/g);
  if (invalidChars && invalidChars.length > 0) {
    const uniq = [...new Set(invalidChars)];
    err.innerHTML = '数据码包含 <span class="font-mono">' + uniq.map(c => c === ' ' ? '␣' : c).join('') + '</span> 等非法字符（共 ' + invalidChars.length + ' 个）。<br>请重新复制完整的数据码再导入。';
    err.classList.remove('hidden');
    return;
  }
  if (cleanedCount > 0) {
    console.info('[import] 自动清理掉了 ' + cleanedCount + ' 个干扰字符（空白/反斜杠/URL-safe 转换）');
  }
  if (raw.length < 20) {
    err.textContent = '数据码太短（仅 ' + raw.length + ' 字符）。请确认复制完整。';
    err.classList.remove('hidden');
    return;
  }
  let jsonStr = null;
  const failReasons = [];
  // 1. 尝试 pako（zlib/deflate）解压
  try {
    if (typeof pako !== 'undefined') {
      const binary = Uint8Array.from(atob(raw), c => c.charCodeAt(0));
      if (binary.length && binary[0] === 0x78) {
        // 有 zlib header 才走 pako
        const inflated = pako.inflate(binary, { to: 'string' });
        if (inflated && inflated.trimLeft().charAt(0) === '{') { jsonStr = inflated; }
      }
    }
  } catch (e) { failReasons.push('pako: ' + (e.message || e)); }
  // 2. 尝试 LZString 解压
  if (!jsonStr && typeof LZString !== 'undefined') {
    try {
      const out = LZString.decompressFromBase64(raw);
      // 严格校验：解出来必须看起来像 JSON（以左花括号开头）
      if (out && out.trimLeft().charAt(0) === '{') jsonStr = out;
      else failReasons.push('LZString 解压结果不像 JSON');
    } catch (e) { failReasons.push('LZString: ' + (e.message || e)); }
  }
  // 3. 尝试 unicode-base64（最早版本用的兼容路径：btoa(unescape(encodeURIComponent(json)))）
  if (!jsonStr) {
    try {
      const utf8Bytes = Uint8Array.from(atob(raw), c => c.charCodeAt(0));
      const decoded = new TextDecoder('utf-8').decode(utf8Bytes);
      if (decoded && decoded.trimLeft().charAt(0) === '{') jsonStr = decoded;
      else failReasons.push('unicode-base64 解码结果不像 JSON');
    } catch (e) { failReasons.push('unicode-base64: ' + (e.message || e)); }
  }
  // 4. 直接 JSON 解析（明文数据码兼容）
  if (!jsonStr) {
    try {
      const obj = JSON.parse(raw);
      if (obj && typeof obj === 'object') jsonStr = raw;
    } catch (e) { failReasons.push('直接 JSON: ' + (e.message || e)); }
  }
  if (!jsonStr) {
    err.innerHTML = '数据码格式不正确<br><span class="text-[10px] text-gray-500">(' + failReasons.join('; ') + ')<br>建议：回到原设备重新导出 → 完整复制数据码 → 重新导入</span>';
    err.classList.remove('hidden');
    return;
  }
  let data;
  try {
    data = JSON.parse(jsonStr);
  } catch (e) {
    err.textContent = '数据码解析失败：' + (e.message || e);
    err.classList.remove('hidden');
    return;
  }
  if (!data || typeof data !== 'object') {
    err.textContent = '数据码内容不是合法的对象结构';
    err.classList.remove('hidden');
    return;
  }
  // 兼容性校验：避免导入过期的/不完整的数据
  const incomingTasks = Array.isArray(data.tasks) ? data.tasks.length : 0;
  const incomingNotes = Array.isArray(data.notes) ? data.notes.length : 0;
  const localTasks = state.tasks.length;
  const localNotes = state.notes.length;
  const localFinance = (state.finance || []).length;
  if (!confirm(`即将导入：${incomingTasks} 个任务，${incomingNotes} 个笔记。\n当前设备：${localTasks} 个任务，${localNotes} 个笔记。\n\n导入后<strong>当前设备的数据会被覆盖</strong>。\n（确认导入前会自动备份，可随时还原）`)) return;
  // 在覆盖前备份当前 state（防止误清空）
  const backup = {
    ts: new Date().toISOString(),
    state: JSON.parse(JSON.stringify(state))
  };
  safeSetItem('dora_import_backup', JSON.stringify(backup));
  // 用默认值兜底
  const defaults = {
    tasks: [], notes: [], finance: [], taskHistory: {}, lastVisitDate: ''
  };
  state = { ...defaults, ...data };
  if (!Array.isArray(state.tasks)) state.tasks = [];
  if (!Array.isArray(state.notes)) state.notes = [];
  if (!Array.isArray(state.finance)) state.finance = [];
  if (!state.taskHistory) state.taskHistory = {};
  state.finance.forEach(item => {
    if (!item.sector && item.name) item.sector = item.name;
  });
  saveState(); render();
  // 用模态框展示结果 + 撤销入口
  showModal(`
    <div class="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-[430px] p-5">
      <div class="text-center mb-4">
        <div class="text-3xl mb-2">✅</div>
        <h3 class="text-lg font-bold text-gray-800">数据导入成功</h3>
        <p class="text-xs text-gray-500 mt-1">已自动备份本次导入前的状态</p>
      </div>
      <div class="bg-gray-50 rounded-xl p-3 text-xs text-gray-600 space-y-1 mb-4">
        <div class="flex justify-between"><span>任务数</span><span>${state.tasks.length}（之前 ${localTasks}）</span></div>
        <div class="flex justify-between"><span>笔记数</span><span>${state.notes.length}（之前 ${localNotes}）</span></div>
        <div class="flex justify-between"><span>理财记录</span><span>${state.finance.length}（之前 ${localFinance}）</span></div>
      </div>
      <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-[11px] text-amber-800 mb-4 leading-relaxed">
        如果发现数据不对，点下方「还原」可一键恢复到本机导入前的状态（仅本次有效，后续操作会覆盖此备份）。
      </div>
      <div class="flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-700 text-sm font-medium">完成</button>
        <button onclick="restoreImportBackup()" class="flex-1 py-3 rounded-xl bg-amber-500 text-white text-sm font-medium">还原备份</button>
      </div>
    </div>
  `);
}

function restoreImportBackup() {
  const raw = safeGetItem('dora_import_backup');
  if (!raw) { alert('已经没有可恢复的备份了。'); return; }
  let backup;
  try { backup = JSON.parse(raw); } catch (e) { alert('备份数据损坏'); return; }
  if (!backup.state) { alert('备份数据损坏'); return; }
  if (!confirm(`将恢复到 ${backup.ts} 时的状态，替代当前已导入的数据。\n确认继续？`)) return;
  state = backup.state;
  // 兼容性兜底
  if (!Array.isArray(state.tasks)) state.tasks = [];
  if (!Array.isArray(state.notes)) state.notes = [];
  if (!Array.isArray(state.finance)) state.finance = [];
  if (!state.taskHistory) state.taskHistory = {};
  saveState(); render();
  safeRemoveItem('dora_import_backup');
  closeModal();
  alert('已恢复到导入前的状态 ✅');
}

// Allow Enter key on lock screen
document.getElementById('lock-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') handleLock(); });
document.getElementById('lock-new-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') handleLock(); });
document.getElementById('lock-confirm-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') handleLock(); });
document.getElementById('lock-sync-input').addEventListener('keydown', e => {
  // Enter (without Shift) 直接提交；Shift+Enter 允许换行
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleImportSync(); }
});

/* Init */
initLockScreen();
</script>
